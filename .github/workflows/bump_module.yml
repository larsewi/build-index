name: Bump module

on:
  workflow_dispatch:
    inputs:
      module:
        description: Name of the module to bump
        required: true
        type: string
      increment:
        description: Part of the version to bump
        required: true
        type: choice
        default: patch
        options:
          - major
          - minor
          - patch
          - release

permissions:
  contents: write # This is required for cfengine/create-pull-request
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checks-out repository
        # v7 is not compatible with cfengine/create-pull-request
        uses: actions/checkout@v4

      - name: Install cfbs
        run: pip3 install cfbs

      - id: bump
        name: Bump the module
        # Passed through the environment to avoid shell injection
        env:
          MODULE: ${{ inputs.module }}
          INCREMENT: ${{ inputs.increment }}
        run: python3 scripts/bump_module.py "$MODULE" "$INCREMENT"

      - name: Commit cfbs.json
        env:
          COMMIT_MESSAGE: ${{ steps.bump.outputs.commit_message }}
        run: |
          git config user.name 'GitHub'
          git config user.email '<noreply@github.com>'
          git add cfbs.json
          git commit -m "$COMMIT_MESSAGE"

      - name: Create Pull Request
        uses: cfengine/create-pull-request@v7
        with:
          sign-commits: true
          title: ${{ steps.bump.outputs.commit_message }}
          body: Please review before merging
          reviewers: |
            olehermanse
            nickanderson
          branch: bump/${{ inputs.module }}
